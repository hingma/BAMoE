# Experiment 2: Main BAMoE forecasting results
# Heterogeneous experts on all 8 datasets x 4 horizons.

model: BAMoE 
top_k: 2
routing: learned_sparse
load_balance_coef: 0.01

results: ./_results
checkpoints: ./_checkpoints

seq_len: 96
d_model: 64
n_heads: 8
n_layers: 6
d_ff: 128
dropout: 0.2
patch_len: 16
stride: 8

batch_size: 64  # default; run_main.sh overrides per dataset
learning_rate: 1.0e-4
train_epochs: 50
patience: 10
weight_decay: 1.0e-4
lradj: cosine
