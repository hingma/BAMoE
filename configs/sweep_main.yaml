# Wandb sweep config for BAMoE hyperparameter search.
#
# Launch with:
#   wandb sweep configs/sweep_main.yaml          # prints SWEEP_ID
#   wandb agent <entity>/<project>/<SWEEP_ID>
#
# Each agent run calls the command below; wandb injects sampled values as
# --key=value args, which override the YAML defaults via run.py's two-pass
# parser.  Fix data/pred_len here or pass them via the wandb agent command.

program: run.py
method: bayes
metric:
  goal: minimize
  name: val_loss

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  dropout:
    values: [0.05, 0.1, 0.2]
  d_model:
    values: [128, 256, 384]
  d_ff:
    values: [256, 512, 768]
  n_layers:
    values: [3, 4, 6]
  load_balance_coef:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 1.0e-1
  top_k:
    values: [1, 2, 3]

command:
  - ${env}
  - python
  - ${program}
  - --config
  - configs/main.yaml
  - --wandb
  - --data
  - ETTh1
  - --pred_len
  - "96"
  - ${args}
